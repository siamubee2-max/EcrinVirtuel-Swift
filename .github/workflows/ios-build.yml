# Build iOS sur runner macOS — vérification de compilation continue.
#
# Ce repo est développé depuis des sessions Claude Code cloud (Linux, sans
# Xcode) : ce workflow est la seule vérification de build automatisée.
# Attention quota : les minutes macOS comptent x10 sur le plan gratuit GitHub
# (~200 min macOS réelles/mois) — le workflow ne tourne donc que sur les
# branches de travail et à la demande.
#
# Secrets.xcconfig est gitignoré ; le CI le génère avec la clé anon Supabase
# (publiable par design — la sécurité est assurée par RLS) et une clé
# RevenueCat factice, suffisant pour compiler (aucun runtime ici).

name: iOS Build

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Garde-fou tarifaire — Ubuntu, quelques secondes, aucune minute macOS.
  # L'app, les deux Edge Functions et le sandbox StoreKit énoncent chacun la
  # grille de prix ; quand ils divergent, rien ne casse — l'utilisatrice paie
  # simplement un prix ou reçoit un nombre de crédits que personne n'a voulu.
  pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check pricing consistency
        run: python3 scripts/check-pricing-consistency.py

      # XcodeGen réécrit ce chemin en `../../` à CHAQUE génération (vérifié le
      # 18/09/2026). Deux niveaux tombent dans le bundle .xcodeproj, pas à la
      # racine : Xcode lance alors l'app sans configuration StoreKit, en
      # silence, et aucun produit ne se résout sur simulateur.
      - name: Check StoreKit scheme path
        run: ./scripts/fix-storekit-scheme-path.sh --check

      # project.pbxproj est généré mais versionné : c'est lui qui sert à la CI
      # et à qui compile sans régénérer. Bumper project.yml sans régénérer
      # laisse l'archive partir avec l'ANCIEN numéro, et ASC refuse l'upload
      # pour doublon alors que project.yml affiche bien le nouveau.
      - name: Check build number is in sync
        run: ./scripts/check-build-number-sync.sh

  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Le code utilise des APIs iOS 26 (.glassEffect) — le Xcode par défaut
      # du runner est plus ancien ; prendre le plus récent installé.
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Secrets.xcconfig (build-only values)
        run: |
          cat > Secrets.xcconfig << 'EOF'
          SUPABASE_URL = https:/$()/vffafgzlsmfecqejoytw.supabase.co
          SUPABASE_ANON_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmZmFmZ3psc21mZWNxZWpveXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODQ2MTksImV4cCI6MjEwMjU2MDYxOX0.rXxUU16uyjuqqu9FrfTeCNxo6KGzrDNyy4H1GAnaVNo
          REVENUECAT_IOS_KEY = appl_ci_placeholder_build_only
          EOF

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('EcrinVirtuel.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (iOS Simulator, Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EcrinVirtuel.xcodeproj \
            -scheme EcrinVirtuel \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
