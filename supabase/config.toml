# Canonical Supabase project (see CLAUDE.md — former projects are DEAD).
project_id = "vffafgzlsmfecqejoytw"

# ── Auth ─────────────────────────────────────────────────────────────────────
# Applied to the remote project with `supabase config push` (review the diff!).
[auth]
site_url = "https://inferencevision.store/ecrin"
additional_redirect_urls = [
  "ecrin://login-callback",
  "https://inferencevision.store/ecrin",
]

# The iOS app signs in with a 6-digit EMAIL OTP CODE (verifyOTP), not a link.
# Default templates send {{ .ConfirmationURL }} — these override them so both
# new signups (confirmation) and returning users (magic_link) receive a code.
[auth.email.template.confirmation]
subject = "Votre code de connexion — L'Écrin Virtuel"
content_path = "./supabase/templates/otp_code.html"

[auth.email.template.magic_link]
subject = "Votre code de connexion — L'Écrin Virtuel"
content_path = "./supabase/templates/otp_code.html"

# SMTP dédié (Resend) — le mailer intégré Supabase est limité à ~2 emails/h.
# La clé API Resend n'est JAMAIS committée : elle est lue depuis la variable
# d'environnement au moment du push : RESEND_SMTP_PASS=re_… supabase config push
# admin_email : domaine de test Resend tant que inferencevision.store n'est pas
# vérifié dans Resend → Domains (ensuite : ecrin@inferencevision.store).
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_PASS)"
admin_email = "onboarding@resend.dev"
sender_name = "L'Écrin Virtuel"

# Native Sign in with Apple (signInWithIdToken) — client_id = app bundle id.
[auth.external.apple]
enabled = true
client_id = "com.ecrin.jewelry"
secret = ""

# ── Edge Functions (read by `supabase functions deploy`) ─────────────────────
# verify-attestation is called server-to-server by tryon-generate → no user JWT.
[functions.verify-attestation]
verify_jwt = false

# tryon-generate is user-facing → keep JWT verification on.
[functions.tryon-generate]
verify_jwt = true

# revenuecat-webhook is called by RevenueCat's servers (shared-secret auth,
# no Supabase JWT) → verification must stay off.
[functions.revenuecat-webhook]
verify_jwt = false
