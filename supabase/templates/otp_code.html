<html>
  <body style="margin:0;padding:0;background-color:#0B0B0D;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0B0B0D;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background-color:#141416;border:1px solid #2a2a2e;border-radius:16px;padding:36px 28px;">
            <tr>
              <td align="center" style="padding-bottom:8px;">
                <span style="color:#D4AF37;font-size:13px;letter-spacing:4px;">L'ÉCRIN VIRTUEL</span>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:16px 0 8px;">
                <span style="color:#f5f5f5;font-size:17px;">Votre code de connexion</span>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:12px 0 20px;">
                <span style="color:#D4AF37;font-size:36px;font-weight:bold;letter-spacing:8px;">{{ .Token }}</span>
              </td>
            </tr>
            <tr>
              <td align="center">
                <span style="color:#8a8a8e;font-size:13px;line-height:1.5;">
                  Saisissez ce code dans l'application.<br />
                  Il expire dans 1&nbsp;heure. Si vous n'êtes pas à l'origine de cette
                  demande, ignorez simplement cet email.
                </span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
